name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A newer push to a PR cancels its older run. A run on main is never
# cancelled once started, so a deploy can't be cut off midway; a newer push
# only replaces a run still waiting in the queue.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm nx run-many -t lint typecheck build
      # Bundles the Worker from the build above, so a bundling error fails the
      # PR instead of the deploy.
      - run: pnpm --filter portfolio exec opennextjs-cloudflare build --skipNextBuild

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter portfolio exec playwright install --with-deps chromium
      - run: pnpm nx e2e portfolio
        env:
          # Playwright's bundled Chromium instead of an installed Chrome.
          PLAYWRIGHT_CHANNEL: ""
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: apps/portfolio/test-results/
          retention-days: 7

  deploy:
    name: deploy
    needs: [checks, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm nx deploy portfolio
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
